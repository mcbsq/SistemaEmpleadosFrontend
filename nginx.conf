server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA (React Router): cualquier ruta que no sea un archivo real cae a
    # index.html — necesario para las rutas de cliente (/cibercom, /Login,
    # /Perfil/:id, etc.) o recargar la página en ellas daría 404 de nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Igual que el rewrite de vercel.json: el API vive en /api del mismo
    # sitio para que la cookie de sesión sea "first-party". En Docker el
    # backend es el servicio `backend` de docker-compose.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 25m;
    }

    location ~* \.(?:css|js|map|jpg|jpeg|gif|png|svg|ico|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}
